<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="description" content="PizzaGo: fresh pizza, snacks and drinks in Astana. A student delivery website.">
    <title>Menu | PizzaGo</title>
    <link rel="icon" href="images/pizza.svg" type="image/svg+xml">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="styles.css" rel="stylesheet">
</head>
<body>
    <header class="site-header">
        <nav class="navbar navbar-expand-lg" data-bs-theme="dark" aria-label="Main navigation">
            <div class="container">
                <a class="navbar-brand fw-bold" href="index.html"><img src="images/pizza.svg" width="32" height="32" alt=""> Pizza<span class="text-warning">Go</span></a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#mainNav" aria-controls="mainNav" aria-expanded="false" aria-label="Toggle navigation"><span class="navbar-toggler-icon"></span></button>
                <div class="collapse navbar-collapse" id="mainNav">
                    <ul class="navbar-nav ms-auto">
                    <li class="nav-item"><a class="nav-link" href="index.html">Home</a></li>
                    <li class="nav-item"><a class="nav-link active" href="menu.html" aria-current="page">Menu</a></li>
                    <li class="nav-item"><a class="nav-link" href="deals.html">Deals</a></li>
                    <li class="nav-item"><a class="nav-link" href="cart.html">Cart <span id="cartCount" class="badge text-bg-warning"></span></a></li>
                    <li class="nav-item"><a class="nav-link" href="tracking.html">Track order</a></li>
                    <li class="nav-item"><a class="nav-link" href="contact.html">Contact</a></li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>
    <main class="container py-5">
        <h1>Our menu</h1>
        <p class="lead">Choose your pizza size, add a drink and make it a meal.</p>
        <div class="row g-3 mb-3">
            <div class="col-md-8">
                <label class="form-label" for="searchInput">Search dishes</label>
                <input class="form-control" id="searchInput" type="search" placeholder="Try Pepperoni" aria-controls="productList">
            </div>
            <div class="col-md-4">
                <label class="form-label" for="categoryFilter">Category</label>
                <select class="form-select" id="categoryFilter" aria-controls="productList">
                    <option value="all">All dishes</option>
                    <option value="pizza">Pizza</option>
                    <option value="snacks">Snacks</option>
                    <option value="drinks">Drinks</option>
                    <option value="desserts">Desserts</option>
                </select>
            </div>
        </div>
        <p id="menuCount" class="text-secondary" role="status"></p>
        <p id="menuFeedback" class="text-success" role="status"></p>
        <div class="row g-4" id="productList"></div>
        <noscript><p>Enable JavaScript to view the interactive menu.</p></noscript>
    </main>

    <footer class="site-footer">
        <div>PizzaGo · Astana · Student project</div>
        <a href="contact.html">Contact &amp; opening hours</a>
        <div class="footer-names">
            <span>Aruzhan Amerkhanova</span>
            <span>Arai Uakyt</span>
            <span>Sulukhan Aizharykova</span>
        </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js" integrity="sha256-/JqT3SQfawRcv/BIHPThkBvs0OEvtFFmqPF/lYI/Cxo=" crossorigin="anonymous"></script>
    <script src="script.js"></script>
</body>
</html>
